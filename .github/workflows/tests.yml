name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax (pipeline.py, monitor_engine.py)
        run: python -m py_compile pipeline.py monitor_engine.py

      - name: Run unit tests
        # Includes tests/test_monitor_engine.py, which uses Streamlit's
        # AppTest to actually execute monitor_engine.py's script and assert
        # no exception -- unlike a `curl` check against a running
        # `streamlit run` process (removed from here after it turned out to
        # report success even when the script itself was crashing: the
        # initial HTTP response is just the static page shell, served
        # before the Python script runs at all). Since no model artifacts
        # are committed, this exercises the "artifacts missing" error path
        # (pipeline.load_artifacts -> st.error + st.stop) here in CI.
        run: pytest
